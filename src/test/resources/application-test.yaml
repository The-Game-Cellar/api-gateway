# Test profile defaults. Tracked in git so a clean checkout builds without any
# local, gitignored override file.

# Distributed rate limiting off so context-load tests do not need a live Redis.
recommendation:
  ratelimit:
    distributed: false

# The Redis health indicator would report DOWN with no Redis to reach, and the suite asserts
# only that /actuator/health is reachable without a token, not what it says.
management:
  health:
    redis:
      enabled: false

# Placeholder value only. The real secret is supplied via environment at runtime.
GATEWAY_ADMIN_CLIENT_SECRET: test-dummy-secret

# Wide open so the auth suite never trips a limit by sheer volume. RateLimitTest overrides
# these with tiny values in its own context to reach the 429 path on purpose.
RATE_LIMIT_LOGIN_REQUESTS: 100000
RATE_LIMIT_RECOMMENDATIONS_REQUESTS: 100000
