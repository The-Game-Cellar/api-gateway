server:
  port: ${GATEWAY_PORT:8000}
  servlet:
    session:
      # Only used to carry the PKCE verifier, state and nonce across the Keycloak
      # round trip, so the window is short. SameSite must stay Lax: Strict would drop
      # the cookie on the cross-site redirect back from Keycloak and every login would
      # fail state validation.
      timeout: 5m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

spring:
  application:
    name: api-gateway
  http:
    clients:
      # Proxied traffic to the three services goes through Boot's RestClient.Builder, so
      # these are the only timeouts it has. Read is generous: a game-service search may
      # wait on IGDB, and a recommendation read may build a cold pool.
      connect-timeout: ${GATEWAY_PROXY_CONNECT_TIMEOUT:2s}
      read-timeout: ${GATEWAY_PROXY_READ_TIMEOUT:30s}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:game-cellar}/protocol/openid-connect/certs

recommendation:
  ratelimit:
    distributed: ${RECOMMENDATION_RATELIMIT_DISTRIBUTED:true}

security:
  internal:
    # Shared secret for library-service's /internal/** paths, which the deletion ledger sits behind.
    token: ${INTERNAL_SERVICE_TOKEN:}

gateway:
  outbound:
    # The calls this service makes itself: Keycloak token and Admin endpoints, library-service
    # purge and ledger. All on the compose network, so short. A hung call here would otherwise
    # hold a login open or stall the deletion retry job's single scheduler thread for good.
    connect-timeout-ms: ${GATEWAY_OUTBOUND_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${GATEWAY_OUTBOUND_READ_TIMEOUT_MS:5000}

account-deletion:
  retry:
    # Finishes deletions whose library purge committed but whose identity delete was never
    # confirmed. The ledger only lists rows older than a minute, so the cadence matches.
    fixed-delay-ms: ${ACCOUNT_DELETION_RETRY_DELAY_MS:60000}
    initial-delay-ms: ${ACCOUNT_DELETION_RETRY_INITIAL_DELAY_MS:60000}
    # Every this-many failed attempts on one row logs at ERROR, which reaches Sentry.
    max-attempts: ${ACCOUNT_DELETION_RETRY_MAX_ATTEMPTS:10}

sentry:
  # Empty default is deliberate: with no DSN the SDK is a no-op, so local runs and the
  # test suite never ship events. Only production sets it.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  traces-sample-rate: 0
  send-default-pii: false
  # Lifts the MDC key onto the event as a tag, which is what ties an event to its log lines.
  context-tags:
    - requestId

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # The body is UP or DOWN and nothing else. The endpoint is public through /healthz
      # for the uptime probe, so it must not describe which component failed.
      show-details: never

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr([%X{requestId:-........}]){magenta} %clr([%-15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"